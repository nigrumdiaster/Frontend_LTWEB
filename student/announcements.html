<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Báo - Sinh Viên - FIT Topic Manager</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../js/vendor/sweetalert2/sweetalert2.min.css">
</head>
<body>
    <div class="app-layout">
        <!-- SIDEBAR MENU BÊN TRÁI (SINH VIÊN) -->
        <aside class="sidebar">
            <div class="sidebar-brand" style="padding: 16px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1);">
                <div style="font-size: 28px;">🎓</div>
                <div style="font-weight: bold; color: #fff; margin-top: 4px;">FIT TOPIC</div>
                <small style="color: #93c5fd; font-size: 11px;">CỔNG SINH VIÊN</small>
            </div>

            <div class="sidebar-category-title">TÀI KHOẢN</div>
            <ul class="sidebar-menu" style="list-style: none; padding: 0; margin: 0;">
                <li class="sidebar-menu-item"><a href="profile.html"><span>👤</span> Thông tin cá nhân</a></li>
            </ul>
            <div class="sidebar-category-title">ĐỀ TÀI</div>
            <ul class="sidebar-menu" style="list-style: none; padding: 0; margin: 0;">
                <li class="sidebar-menu-item"><a href="lecturers.html"><span>👨‍🏫</span> Danh sách giảng viên</a></li>
                <li class="sidebar-menu-item"><a href="registration-periods.html"><span>📅</span> Đợt đăng ký đề tài</a></li>
                <li class="sidebar-menu-item"><a href="topics.html"><span>📚</span> Đề tài đã công bố</a></li>
                <li class="sidebar-menu-item"><a href="my-group.html"><span>👥</span> Nhóm của tôi</a></li>
                <li class="sidebar-menu-item"><a href="results.html"><span>🏆</span> Kết quả</a></li>
                <li class="sidebar-menu-item active"><a href="announcements.html"><span>📢</span> Thông báo</a></li>
            </ul>

            <div style="padding: 16px; margin-top: auto;">
                <a href="#" onclick="logout(); return false;" style="color: #fca5a5; text-decoration: none; font-size: 13.5px; display: flex; align-items: center; gap: 8px;">
                    <span>🚪</span> Đăng xuất
                </a>
            </div>
        </aside>

        <!-- NỘI DUNG CHÍNH BÊN PHẢI -->
        <main class="main-wrapper">
            <div class="page-header" style="margin-bottom: 24px;">
                <div class="page-title">
                    <h1 style="font-size: 24px; color: #0f172a; margin-bottom: 4px;">Thông Báo</h1>
                    <p style="color: #64748b; font-size: 14px;">Thông báo chính thức của nhà trường và khoa CNTT</p>
                </div>
            </div>

            <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px;">
                <div style="flex: 1; min-width: 220px;">
                    <label for="annSearch" style="display: block; color: #64748b; font-size: 13px; margin-bottom: 4px;">Tìm kiếm</label>
                    <input type="text" id="annSearch" placeholder="Tiêu đề, nội dung, người đăng..." style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; background: white;">
                </div>
                <button type="button" id="btnReloadAnn" class="btn btn-secondary">Tải lại</button>
                    <button type="button" id="btnResetFilters" class="btn btn-secondary">Đặt lại</button>
            </div>
            <p id="annLoadError" role="status" style="display: none; margin-bottom: 16px; color: #b91c1c;"></p>

            <div id="annArea"></div>
        </main>
    </div>

    <!-- MODAL CHI TIẾT THÔNG BÁO -->
    <div id="annModal" class="modal">
        <div class="modal-content" style="max-width: 720px; max-height: 90vh; overflow-y: auto;">
            <div class="modal-header">
                <h3 id="annModalTitle">Thông báo</h3>
            </div>
            <div id="annModalBody" style="margin: 16px 0;"></div>
            <div style="display: flex; justify-content: flex-end;">
                <button type="button" onclick="closeAnnouncementModal()" class="btn btn-secondary">Đóng</button>
            </div>
        </div>
    </div>

    <script src="../js/vendor/sweetalert2/sweetalert2.min.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/pagination.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/student/announcements.js"></script>
</body>
</html>
